name: Local contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  plugin-source:
    name: Plugin source checks (no SDK activation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install locked source-test dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check metadata, adapters and package file selection
        env:
          SECRETARY_HTTP_TESTS: '1'
        run: |
          bun run check:plugin
          bun run test
          bun test scripts/acceptance.test.ts
          bun run --cwd plugins/secretary-tools bundle
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require qualified dependency locks
        run: |
          if [ ! -f Cargo.lock ] || { [ ! -f bun.lock ] && [ ! -f bun.lockb ]; }; then
            echo 'Release blocked: generate, validate, and commit dependency locks in a network-enabled environment.' >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Verify local behavior
        run: bash scripts/verify.sh
      - name: Install pinned Postman CLI without lifecycle scripts
        run: npm install --global --ignore-scripts postman-cli@1.75.0
      - name: Verify real bridge and Core against Google-only simulations
        timeout-minutes: 10
        run: bash scripts/acceptance-all.sh
