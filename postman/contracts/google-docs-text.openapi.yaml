openapi: 3.0.3
info:
  title: Google Docs bounded text and revision subset
  version: v1
  description: >-
    Local contract subset, not a complete Docs emulator or Core contract.
    Sources: https://developers.google.com/workspace/docs/api/reference/rest/v1/documents/get
    https://developers.google.com/workspace/docs/api/reference/rest/v1/documents/batchUpdate
    https://developers.google.com/workspace/docs/api/reference/rest/v1/documents/request
    checked 2026-10-28. Only Google is simulated; Core and its journal run for real.
servers:
  - url: https://docs.googleapis.com/v1
paths:
  /documents/{documentId}:
    get:
      operationId: getDocument
      parameters:
        - {in: path, name: documentId, required: true, schema: {type: string}}
        - {in: query, name: includeTabsContent, required: true, schema: {type: boolean, enum: [true]}}
        - {in: query, name: suggestionsViewMode, required: true, schema: {type: string, enum: [SUGGESTIONS_INLINE]}}
      responses:
        '200':
          description: Requested document with tab bodies; revision is available only under provider access policy.
          content:
            application/json:
              schema:
                type: object
                required: [documentId, tabs]
                properties:
                  documentId: {type: string}
                  title: {type: string}
                  revisionId: {type: string}
                  tabs: {type: array, items: {type: object}}
        '400': {description: Invalid query}
        '403': {description: Access denied}
        '404': {description: Document not found}
        '503': {description: Provider unavailable}
  /documents/{documentId}:batchUpdate:
    post:
      operationId: batchUpdateText
      parameters:
        - {in: path, name: documentId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [writeControl, requests]
              additionalProperties: false
              properties:
                writeControl:
                  type: object
                  required: [requiredRevisionId]
                  properties:
                    requiredRevisionId: {type: string}
                  additionalProperties: false
                requests:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    oneOf:
                      - type: object
                        required: [insertText]
                        additionalProperties: false
                        properties:
                          insertText:
                            type: object
                            required: [text, endOfSegmentLocation]
                            additionalProperties: false
                            properties:
                              text: {type: string}
                              endOfSegmentLocation:
                                type: object
                                required: [tabId]
                                properties:
                                  tabId: {type: string}
                                additionalProperties: false
                      - type: object
                        required: [replaceAllText]
                        additionalProperties: false
                        properties:
                          replaceAllText:
                            type: object
                            required: [replaceText, tabsCriteria, containsText]
                            additionalProperties: false
                            properties:
                              replaceText: {type: string}
                              tabsCriteria:
                                type: object
                                required: [tabIds]
                                properties:
                                  tabIds: {type: array, minItems: 1, maxItems: 1, items: {type: string}}
                                additionalProperties: false
                              containsText:
                                type: object
                                required: [text, matchCase, searchByRegex]
                                properties:
                                  text: {type: string, minLength: 1}
                                  matchCase: {type: boolean, enum: [true]}
                                  searchByRegex: {type: boolean, enum: [false]}
                                additionalProperties: false
      responses:
        '200': {description: BatchUpdateDocumentResponse with replies and write control}
        '400': {description: Invalid request or required revision is not latest; no update applied}
        '403': {description: Access denied}
        '404': {description: Document not found}
        '503': {description: Provider failure; outcome may be uncertain}
