openapi: 3.0.3
info:
  title: Google Sheets read subset for secretary acceptance
  version: v4
  description: >-
    Local subset of official Google Sheets v4 spreadsheets.get and Sheet/GridData/CellData.
    Sources https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets/get
    and https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets/sheets.
    This is not a full Google API contract and is not the secretary Core contract.
servers:
  - url: https://sheets.googleapis.com/v4
paths:
  /spreadsheets/{spreadsheetId}:
    get:
      operationId: getSpreadsheet
      parameters:
        - in: path
          name: spreadsheetId
          required: true
          schema: {type: string}
        - in: query
          name: includeGridData
          schema: {type: boolean}
        - in: query
          name: ranges
          schema: {type: array, items: {type: string}}
          style: form
          explode: true
        - in: query
          name: fields
          schema: {type: string}
      responses:
        '200':
          description: Spreadsheet metadata and requested grid data.
          content:
            application/json:
              schema:
                type: object
                required: [spreadsheetId, sheets]
                properties:
                  spreadsheetId: {type: string}
                  sheets:
                    type: array
                    items:
                      type: object
                      properties:
                        properties:
                          type: object
                          properties:
                            sheetId: {type: integer}
                            title: {type: string}
                        merges: {type: array, items: {type: object}}
                        data: {type: array, items: {type: object}}
        '400': {description: Invalid request}
        '404': {description: Spreadsheet not found}
        '429': {description: Quota exhausted}
        '503': {description: Temporary provider failure}
