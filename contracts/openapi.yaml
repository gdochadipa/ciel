    "/v1/tools/sheets_read": {
      "post": {
        "operationId": "sheets_read",
        "description": "Read one bounded registered projection. Cursor is bound to source fingerprint, mapping version and view; source changes invalidate pagination. No arbitrary A1 ranges.",
        "security": [
          {
            "CoreBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "spreadsheet": {
                    "type": "string"
                  },
                  "view": {
                    "type": "string"
                  },
                  "limit": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 100,
                    "default": 50
                  },
                  "cursor": {
                    "type": "string"
                  }
                },
                "required": [
                  "spreadsheet",
                  "view"
                ],
                "additionalProperties": false
              }
            }
