{
  "openapi": "3.1.0",
  "info": {
    "title": "Secretary Core",
    "version": "0.1.0",
    "description": "Read-only T002 contract. JSON serialization is valid YAML. 64 KiB request bound; 2 MiB provider response bound; 10 second total provider operation; two maximum read retries. Production binds loopback 8787; bridge timeout 5 seconds."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8787"
    }
  ],
  "paths": {
