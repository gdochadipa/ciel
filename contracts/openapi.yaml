    "/v1/tools/reports_wedding": {
      "post": {
        "operationId": "reports_wedding",
        "description": "Deterministic numeric known-cost sum counts merged anchors once. Currency, payment balance and completion remain unknown; household and guest data excluded. Cached SUM formulas carry bounded independent numeric-input checks.",
        "security": [
          {
            "CoreBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
