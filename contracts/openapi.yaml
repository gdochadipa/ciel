                            "$ref": "#/components/schemas/Record"
                          }
                        },
                        "source_revision": {
                          "type": "string"
                        },
                        "mapping_version": {
                          "type": "string"
                        },
                        "retrieved_at": {
                          "type": "string",
                          "format": "date-time"
                        }
                      },
                      "required": [
                        "known_cost_total",
                        "known_cost_groups",
