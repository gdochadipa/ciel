                  "document": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 8192
                  },
                  "tab_id": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 8192
                  },
                  "limit": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 10000,
                    "default": 2000
                  },
                  "cursor": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 8192
                  },
                  "mode": {
                    "const": "summary_context"
                  },
                  "max_characters": {
                    "type": "integer",
                    "minimum": 100,
                    "maximum": 10000,
                    "default": 6000,
                    "description": "Global projected Unicode-scalar excerpt budget for summary_context; omit tab_id/limit/cursor."
                  }
                },
                "required": [
                  "document"
                ],
                "additionalProperties": false,
                "oneOf": [
                  {
                    "required": [
