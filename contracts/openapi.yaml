    "/v1/tools/docs_search": {
      "post": {
        "operationId": "docs_search",
        "description": "Read-only literal search in one registered Google Doc body, all projected tabs or optional tab_id. Query nonblank <=256 UTF-8 bytes; nonoverlapping matches, no regex/normalization. Snippets include <=80 Unicode scalar values each side; titles capped at200 scalars. Cursor binds document identity, full source fingerprint, registry version, exact query and tab selection. Offsets are projected Unicode scalars, not native Google edit indices. case_sensitive defaults true; false uses locale-independent full Unicode case folding (unicase 2.10.0). Matches must align to whole original Unicode scalars, including expansions; no normalization or Turkish-specific rules. Cursor binds matching mode and exact query; default/true retain legacy binding. No Drive discovery. Alternatively pass documents (1\u20133 distinct readable registered aliases), mutually exclusive with document/tab_id. Sequential reads, overall four-second Core IO deadline, no partial successful results. Global limit, order by selected documents then tab/text order. Each match includes document alias; sources evidence lists all selected documents. Multi cursor binds ordered selection, exact query/mode, mapping version and every source identity/fingerprint, even unreturned sources. Separate reads are not an atomic provider snapshot.",
        "security": [
          {
            "CoreBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "document": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 8192
                  },
                  "tab_id": {
