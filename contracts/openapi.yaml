                  "cursor": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 8192
                  },
                  "query": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256,
                    "description": "Nonblank exact literal; additionally limited to256 UTF-8 bytes."
                  },
                  "case_sensitive": {
                    "type": "boolean",
                    "default": true,
                    "description": "false uses full Unicode case folding; snippets/offsets retain original text. No normalization."
                  },
                  "documents": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 3,
                    "uniqueItems": true,
                    "items": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 100
                    },
                    "description": "Explicit ordered readable registered aliases, additionally <=100 UTF-8 bytes each. Mutually exclusive with document and tab_id."
                  }
                },
                "required": [
                  "query"
                ],
                "additionalProperties": false,
                "oneOf": [
                  {
                    "required": [
