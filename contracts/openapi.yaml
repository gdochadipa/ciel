{
  "openapi": "3.1.0",
  "info": {
    "title": "Secretary Core",
    "version": "0.3.0",
    "description": "Secretary Core bounded reads and opt-in structured writes. JSON serialization is valid YAML. Legacy workbook views remain read-only. 64 KiB request, 2 MiB provider response, 10 second provider timeout, two read retries; writes never retried automatically. SQLite durable intent and owner-bound approvals; operator-only reconciliation. Google Sheets lacks atomic compare-and-swap: a human edit after preflight may still race the RAW request. Generic registered grid reads are independent of domain profiles. Registered Google Docs supports bounded body-text reads and owner-approved append_text/one-match replace_text with required revision control through the same journal/FSM. No arbitrary resource URL, range or batch request is accepted from tool input."
  },
