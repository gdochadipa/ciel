    "/v1/tools/docs_read": {
      "post": {
        "operationId": "docs_read",
        "description": "Read at most limit Unicode characters of body text, default 2000. Cursor binds document/tab, registry version and source fingerprint; source changes cause stale_cursor. Non-text/layout/headers are not reproduced. For source-backed summaries use mode summary_context with document and optional max_characters100\u201310000(default6000), omitting tab_id/limit/cursor. Core returns bounded untrusted source data, not generated prose; OpenClaw uses its existing model. Fairly allocate prefix excerpts across every nonempty projected body tab, redistribute unused allocations, return S1..Sn citation labels, source identities/revision/fingerprint/mapping/retrieval evidence, original Unicode-scalar offsets, and legacy docs_read continuation cursors for partial tabs. Explicit projected-body coverage/omissions; no layout/header/footer/non-text completeness claim. Packet <=256KiB, error rather than truncate evidence. No model endpoint, scope, memory, journal, mutation or extra tool.",
        "security": [
          {
            "CoreBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
