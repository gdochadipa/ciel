        "operationId": "sheets_list",
        "description": "List operator-registered readable spreadsheets. Caller cannot supply actor, paths or provider hosts.",
        "security": [
          {
            "CoreBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {},
                "required": [],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful tool result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "ok": {
                      "const": true
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "spreadsheets": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "properties": {
                              "spreadsheet": {
                                "type": "string"
                              },
                              "id": {
                                "type": "string"
                              },
                              "readable": {
                                "const": true
                              },
                              "writable": {
                                "const": false
                              }
                            },
                            "required": [
                              "spreadsheet",
                              "id",
                              "readable",
                              "writable"
                            ],
                            "additionalProperties": false
                          }
                        },
                        "mapping_version": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "spreadsheets",
                        "mapping_version"
                      ],
                      "additionalProperties": false
                    }
                  },
                  "required": [
                    "ok",
                    "data"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Invalid core token",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
